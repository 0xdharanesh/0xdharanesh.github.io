		<link rel="stylesheet" href="../assets/css/style.css" />

		<style>
			HTML {
                font-size: 80%;
                overflow-x: hidden;
            }

			body {
				font-family: 'Montserrat', sans-serif;
				font-weight: 300;
				font-size: 15px;
				line-height: 1.7;
				color: #c4c3ca;
				min-height: 100vh;
				width: 100%;
				background-image: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url(../assets/images/batman.jpeg);
				background-position: center;
				background-size: cover;
				position: relative;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				overflow-x: hidden;
				-webkit-transition: all 300ms linear;
				transition: all 300ms linear;
			}

			/* Title */
			.title {
				text-align: center;
				/* margin: 20px; */
			}

			.title h1 {
				font-size: 2.5rem;
				color: #4caf50;
				animation: fadeIn 1.5s ease-in;
			}

			.title p {
				font-size: 2rem;
				color: #3cff00;
				margin-top: 10px;
				animation: fadeIn 2s ease-in;
			}

			/* Contact Section */
			.contact-section {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
				gap: 20px;
				margin: 40px 0;
				width: 80%;
			}

			.contact-card {
				background-color: #ffffff;
				border-radius: 10px;
				box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
				padding: 20px;
				text-align: center;
				transition: transform 0.3s ease-in-out,
					box-shadow 0.3s ease-in-out;
			}

			.contact-card:hover {
				transform: translateY(-10px);
				box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
			}

			.social-link {
				display: flex;
				align-items: center;
				justify-content: center;
				color: #333;
				font-size: 2rem;
				transition: color 0.3s ease-in-out;
			}

			/* Icon Brand Colors on Hover */
			.instagram:hover .bi {
				color: #e4405f;
			}

			.facebook:hover .bi {
				color: #1877f2;
			}

			.linkedin:hover .bi {
				color: #0077b5;
			}

			.reddit:hover .bi {
				color: #ff4500;
			}

			.email:hover .bi {
				color: #d44638;
			}

			.naukri:hover .bi {
				color: #2d7093;
			}

			.github:hover .bi {
				color: #333;
			}

			.gitlab:hover .bi {
				color: #fca121;
			}

			.threads:hover .bi {
				color: #000;
			}

			.x:hover .bi {
				color: #b9b9b9;
			}

			.telegram:hover .bi {
				color: #26a5e4;
			}

			/* Footer */
			footer {
				margin: 30px 0;
				text-align: center;
				font-size: 2rem;
				color: #0400ff;
			}

			/* Animations */
			@keyframes fadeIn {
				0% {
					opacity: 0;
					transform: translateY(-20px);
				}

				100% {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* Responsive Design */
			@media screen and (max-width: 576px) {
				html {
					overflow-y: auto;
					overflow-x: hidden;
				}

				body {
					overflow-y: auto;
					overflow-x: hidden;
					justify-content: flex-start;
					padding: 5.5rem 1rem 2rem;
					box-sizing: border-box;
				}

				.title {
					width: 100%;
					padding: 0 0.5rem;
				}

				.title h1 {
					font-size: 2rem;
				}

				.title p {
					font-size: 1.2rem;
				}

				.contact-section {
					grid-template-columns: repeat(3, minmax(0, 1fr));
					gap: 12px;
					width: 100%;
					max-width: 360px;
					margin: 1.5rem auto;
					padding: 0;
				}

				.contact-card {
					padding: 14px 8px;
					font-size: 1rem;
				}

				.social-link {
					font-size: 1.6rem;
				}

				footer {
					font-size: 1.2rem;
					margin: 1.5rem 0 0;
					padding: 0 0.5rem;
				}
			}

			@media screen and (max-width: 380px) {
				.contact-section {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
		</style>
	</head>

	<body>

		<footer>

		<section>

			<script src="../assets/js/script.js"></script>

		<script>
			// JavaScript to change background color on hover
			const xLink = document.getElementById('x-link');
			const xCard = document.getElementById('x-card');

			xLink.addEventListener('mouseover', () => {
				xCard.style.backgroundColor = '#000'; // Change to black on hover
			});

			xLink.addEventListener('mouseout', () => {
				xCard.style.backgroundColor = '#fff'; // Revert back to white when not hovered
			});
		</script>
