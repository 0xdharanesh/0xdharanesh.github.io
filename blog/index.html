		<script>
			

			//name effect
			document.addEventListener("DOMContentLoaded", function () {
				const h1 = document.querySelector(".Name h1");
				const originalText = "0xD#4R4N35#";
				const finalText = "0xDHARANESH";
				let index = 0;

				function typeEffect() {
					if (index < finalText.length) {
						h1.textContent = finalText.slice(0, index + 1);
						index++;
						setTimeout(typeEffect, 100);
					} else {
						setTimeout(reverseEffect, 500);
					}
				}

				function reverseEffect() {
					let letters = finalText.split("");
					let targetLetters = originalText.split("");
					let i = 0;

					let interval = setInterval(() => {
						if (i < targetLetters.length) {
							letters[i] = targetLetters[i];
							h1.textContent = letters.join("");
							i++;
						} else {
							clearInterval(interval);
						}
					}, 100);
				}

				typeEffect();
			});


			
			// Redirect to a new URL after 3 seconds
			setTimeout(function () {
				window.location.href = '../dev.html';
			}, 500);

		</script>
